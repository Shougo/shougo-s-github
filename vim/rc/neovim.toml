[[plugins]]
repo = 'neovim/nvim-lspconfig'
on_event = 'FileType'
lua_source = '''
  -- NOTE: Disable lsp watcher. Too slow on linux
  -- https://github.com/neovim/neovim/issues/23725#issuecomment-1561364086
  require('vim.lsp._watchfiles')._watchfunc = function()
    return function() end
  end

  -- Disable semanticTokensProvider.  It is buggy.
  vim.api.nvim_create_autocmd('LspAttach', {
    callback = function(args)
      local client = vim.lsp.get_client_by_id(args.data.client_id)
      if client then
        client.server_capabilities.semanticTokensProvider = nil
      end
    end,
  })

  vim.diagnostic.config({
      update_in_insert = false,
      virtual_text = {
        severity = {
          min = 'WARN',
        },
        severity_sort = true,
        format = function(diagnostic)
          if diagnostic.code then
            return string.format(
              '%s (%s: %s)',
              diagnostic.message,
              diagnostic.source,
              diagnostic.code
            )
          else
            return string.format(
              '%s (%s)',
              diagnostic.message,
              diagnostic.source
            )
          end
        end,
      },
  })

  local servers = {
    'denols',
    'emmylua_ls',
    'gopls',
    'pyright',
    'rust_analyzer',
    'vtsls',
  }

  vim.lsp.enable(servers)
'''

[[plugins]]
repo = 'atusy/kakehashi.nvim'
on_source = 'nvim-lspconfig'
external_commands = ['kakehashi']
lua_source = '''
  local servers = vim.tbl_keys(vim.lsp._enabled_configs)

  vim.api.nvim_create_autocmd('LspAttach', {
    callback = function(ev)
      local client = vim.lsp.get_client_by_id(ev.data.client_id)
      if client and client.name == 'kakehashi' then
        require('kakehashi').inherit_nvim_lsp_config(
          client,
          servers,
          'keep'
        )
      end
    end,
  })
'''
