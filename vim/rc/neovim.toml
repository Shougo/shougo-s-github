[[plugins]]
repo = 'romus204/tree-sitter-manager.nvim'
if = '!has("win32")'
on_event = ['BufRead', 'CursorHold']
on_ft = ['help']
external_commands = ['tree-sitter']
lua_source = '''
  -- Install parsers
  require("tree-sitter-manager").setup({
    ensure_installed = {
      'c',
      'javascript',
      'rust',
      'python',
      'toml',
      'typescript',
    },
  })

  -- Enable highlight
  vim.api.nvim_create_autocmd('FileType', {
    pattern = {
      'c',
      'python',
      'rust',
      'typescript',
      'vim',
    },
    callback = function()
      vim.treesitter.start()
    end,
  })
'''
