[[plugins]]
repo = 'Shougo/goda.vim'

[[plugins]]
repo = 'Shougo/goda-cmp.vim'
depends = ['goda.vim', 'pum.vim']
hook_add = '''
  autocmd MyAutoCmd BufWritePost ~/.config/vim/rc/goda-cmp/*.go
  \ call goda_cmp#build()
'''
hook_source = '''
  call ddc#disable()

  let g:goda_cmp#config_dir = '~/.config/vim/rc/goda-cmp'

  inoremap <C-n> <Cmd>call pum#map#insert_relative(+1)<CR>
  inoremap <C-p> <Cmd>call pum#map#insert_relative(-1)<CR>
  inoremap <C-y> <Cmd>call pum#map#confirm()<CR>
  inoremap <C-e> <Cmd>call pum#map#cancel()<CR>

  nnoremap : <Cmd>call goda_cmp#enable_cmdline()<CR>:

  call pum#set_option(#{
    preview: v:true,
    previewer: 'goda_cmp#get_previewer',
  })
'''
hook_post_update = '''
  call goda_cmp#build()
'''
