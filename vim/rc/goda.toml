[[plugins]]
repo = 'Shougo/goda-pm.vim'
rtp = ''

[[plugins]]
repo = 'Shougo/goda-pm-ext-lazy.vim'
lazy = false

[[plugins]]
repo = 'Shougo/goda-cmp.vim'
on_event = ['InsertEnter', 'CmdlineEnter']
on_source = 'goda-term.vim'
hooks_file = '$BASE_DIR/goda-cmp.vim'
hook_post_update = '''
  call goda_cmp#build()
'''

[[plugins]]
repo = 'Shougo/goda-cmp-ui-inline.vim'
on_source = 'goda-cmp.vim'

[[plugins]]
repo = 'Shougo/goda-cmp-ui-native.vim'
on_source = 'goda-cmp.vim'

[[plugins]]
repo = 'Shougo/goda-cmp-ui-pum.vim'
depends = 'pum.vim'
on_source = 'goda-cmp.vim'

[[plugins]]
repo = 'Shougo/goda-skk.vim'
on_map = { ict = '<Plug>(goda-skk-' }
hooks_file = '$BASE_DIR/goda-skk.vim'

[[plugins]]
repo = 'Shougo/goda-fi.vim'
hooks_file = '$BASE_DIR/goda-fi.vim'
hook_post_update = '''
  call goda_fi#build()
'''

[[plugins]]
repo = 'Shougo/goda-fi-ui-ff.vim'
on_source = 'goda-fi.vim'

[[plugins]]
repo = 'Shougo/goda-fi-ui-filer.vim'
on_source = 'goda-fi.vim'

[[plugins]]
repo = 'Shougo/goda-term.vim'
hooks_file = '$BASE_DIR/goda-term.vim'
hook_post_update = '''
  call goda_term#build()
'''

[[plugins]]
repo = 'Shougo/goda-term-ui-shell.vim'
on_source = 'goda-term.vim'

[[plugins]]
repo = 'Shougo/goda-term-ui-terminal.vim'
on_source = 'goda-term.vim'

[[plugins]]
repo = 'Shougo/goda-hex.vim'
hooks_file = '$BASE_DIR/goda-hex.vim'
