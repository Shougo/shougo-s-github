[[plugins]]
repo = 'Shougo/goda-pm.vim'
depends = ['goda.vim']

[[plugins]]
repo = 'Shougo/goda-cmp.vim'
depends = ['goda.vim', 'pum.vim']
on_event = ['InsertEnter', 'CmdlineEnter']
hooks_file = '$BASE_DIR/goda-cmp.vim'
hook_post_update = '''
  call goda_cmp#build()
'''

[[plugins]]
repo = 'Shougo/goda-skk.vim'
depends = ['goda.vim']
on_map = { ict = '<Plug>(goda-skk-' }
hooks_file = '$BASE_DIR/goda-skk.vim'

[[plugins]]
repo = 'Shougo/goda-fi.vim'
depends = ['goda.vim']
hooks_file = '$BASE_DIR/goda-fi.vim'
hook_post_update = '''
  call goda_fi#build()
'''

[[plugins]]
repo = 'Shougo/goda-term.vim'
depends = ['goda.vim']
hooks_file = '$BASE_DIR/goda-term.vim'

[[plugins]]
repo = 'Shougo/goda-hex.vim'
depends = ['goda.vim']
hooks_file = '$BASE_DIR/goda-hex.vim'
