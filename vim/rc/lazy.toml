[[plugins]]
repo = 'Shougo/pum.vim'
hook_source = '''
  call pum#set_option(#{
    \   auto_confirm_time: 0,
    \   auto_select: v:false,
    \   blend: 20,
    \   border: 'none',
    \   commit_characters: ['.'],
    \   highlight_scrollbar: 'None',
    \   insert_preview: v:true,
    \   max_height: 5,
    \   max_width: 80,
    \   offset_cmdcol: 0,
    \   padding: v:false,
    \   preview: v:true,
    \   preview_remains: v:true,
    \   preview_width: 80,
    \   reversed: v:false,
    \   use_setline: !has('nvim'),
    \ })

  "call pum#set_local_option('c', #{
  "  \   horizontal_menu: v:false,
  "  \ })

  " NOTE: For horizontal_menu
  call pum#set_option(#{
    \   follow_cursor: v:false,
    \   horizontal_menu: v:false,
    \   max_horizontal_items: 2,
    \ })
'''

[[plugins]]
repo = 'Shougo/junkfile.vim'
on_source = ['ddu.vim']
hook_add = '''
  nnoremap se <Cmd>Ddu junkfile -source-option-junkfile-volatile<CR>
'''

[[plugins]]
repo = 'Shougo/cmdline.vim'
on_source = ['ddu.vim']
hook_add = '''
  cnoremap <CR>  <Cmd>call cmdline#disable()<CR><CR>
'''
hook_source = '''
  call cmdline#set_option(#{
    \   highlight_window: 'None',
    \ })
'''

[[plugins]]
repo = 'Shougo/pum.vim'
hook_source = '''
  call pum#set_option(#{
    \   auto_confirm_time: 0,
    \   auto_select: v:false,
    \   blend: 20,
    \   border: 'none',
    \   commit_characters: ['.'],
    \   highlight_scrollbar: 'None',
    \   insert_preview: v:true,
    \   max_height: 5,
    \   max_width: 80,
    \   offset_cmdcol: 0,
    \   padding: v:false,
    \   preview: v:true,
    \   preview_remains: v:true,
    \   preview_width: 80,
    \   reversed: v:false,
    \   use_setline: !has('nvim'),
    \ })

  "call pum#set_local_option('c', #{
  "  \   horizontal_menu: v:false,
  "  \ })

  " NOTE: For horizontal_menu
  call pum#set_option(#{
    \   follow_cursor: v:false,
    \   horizontal_menu: v:false,
    \   max_horizontal_items: 2,
    \ })

  " Insert mode
  inoremap <S-Tab> <Cmd>call pum#map#insert_relative(-1, 'empty')<CR>
  inoremap <C-n>   <Cmd>call pum#map#select_relative(+1)<CR>
  inoremap <C-p>   <Cmd>call pum#map#select_relative(-1)<CR>
  inoremap <C-y>   <Cmd>call pum#map#confirm_suffix()<CR>
  inoremap <C-o>   <Cmd>call pum#map#confirm_matched_pattern('^\S\+')<CR>
  inoremap <Home>  <Cmd>call pum#map#insert_relative(-9999, 'ignore')<CR>
  inoremap <End>   <Cmd>call pum#map#insert_relative(+9999, 'ignore')<CR>
  inoremap <C-t>   <C-v><Tab>

  " Command-line mode
  cnoremap <S-Tab> <Cmd>call pum#map#insert_relative(-1)<CR>
  cnoremap <C-o>   <Cmd>call pum#map#confirm()<CR>
  cnoremap <C-q>   <Cmd>call pum#map#select_relative(+1)<CR>
  cnoremap <C-z>   <Cmd>call pum#map#select_relative(-1)<CR>
  cnoremap <C-y>   <Cmd>call pum#map#confirm()<CR>

  " Mouse support
  inoremap <LeftMouse>  <Cmd>call pum#map#confirm_mouse()<CR>
  inoremap <RightMouse>  <Cmd>call pum#map#select_mouse()<CR>
  cnoremap <LeftMouse>  <Cmd>call pum#map#confirm_mouse()<CR>
  cnoremap <RightMouse>  <Cmd>call pum#map#select_mouse()<CR>
  tnoremap <LeftMouse>  <Cmd>call pum#map#confirm_mouse()<CR>
  tnoremap <RightMouse>  <Cmd>call pum#map#select_mouse()<CR>
'''

[[plugins]]
repo = 'kana/vim-niceblock'
on_map = { x = '<Plug>' }
hook_add = '''
  xnoremap I  <Plug>(niceblock-I)
  xnoremap A  <Plug>(niceblock-A)
'''

[[plugins]]
repo = 'thinca/vim-qfreplace'
on_ft = ['qf']
[plugins.ftplugin]
qf = '''
  nnoremap <buffer> r <Cmd>Qfreplace<CR>
'''

[[plugins]]
repo = 'itchyny/vim-qfedit'
on_ft = ['qf']

[[plugins]]
repo = 'rhysd/vim-operator-surround'
depends = 'vim-operator-user'
on_map = { n = '<Plug>' }
hook_add = '''
  nnoremap sa <Plug>(operator-surround-append)
  nnoremap sd <Plug>(operator-surround-delete)a
  nnoremap sr <Plug>(operator-surround-replace)a
  nnoremap sc <Plug>(operator-surround-replace)a
'''

[[plugins]]
repo = 'previm/previm'
on_ft = ['markdown', 'rst']
external_commands = ['xdg-open']
hook_source = '''
  let g:previm_open_cmd = 'xdg-open'
'''

# [[plugins]]
# repo = 'katono/rogue.vim'

[[plugins]]
repo = 'lambdalisue/vim-findent'

[[plugins]]
repo = 'tweekmonster/helpful.vim'
on_cmd = 'HelpfulVersion'
extAttrs = { installerMinCommitDays = 0 }

[[plugins]]
repo = 'machakann/vim-vimhelplint'
on_ft = 'help'
[plugins.ftplugin]
help = '''
  nnoremap <buffer> ,r  <Cmd>VimhelpLint!<CR>
'''

[[plugins]]
repo = 'mattn/vim-goimports'
on_ft = 'go'
external_commands = ['goimports']
hook_source = '''
  let g:goimports_simplify = v:true
'''

[[plugins]]
repo = 'dag/vim2hs'
on_ft = 'haskell'
hook_source = '''
  let g:haskell_conceal = v:false
'''

[[plugins]]
repo = 'lambdalisue/vim-guise'
on_source = 'ddt.vim'

