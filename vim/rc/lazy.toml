[[plugins]]
repo = 'kana/vim-niceblock'
on_map = { x = '<Plug>' }
hook_add = '''
  xnoremap I  <Plug>(niceblock-I)
  xnoremap A  <Plug>(niceblock-A)
'''

[[plugins]]
repo = 'thinca/vim-qfreplace'
on_ft = ['qf']
[plugins.ftplugin]
qf = '''
  nnoremap <buffer> r <Cmd>Qfreplace<CR>
'''

[[plugins]]
repo = 'rhysd/vim-operator-surround'
depends = 'vim-operator-user'
on_map = { n = '<Plug>' }
hook_add = '''
  nnoremap sa <Plug>(operator-surround-append)
  nnoremap sd <Plug>(operator-surround-delete)a
  nnoremap sr <Plug>(operator-surround-replace)a
  nnoremap sc <Plug>(operator-surround-replace)a
'''

[[plugins]]
repo = 'previm/previm'
on_ft = ['markdown', 'rst']
external_commands = ['xdg-open']
hook_source = '''
  let g:previm_open_cmd = 'xdg-open'
'''

# [[plugins]]
# repo = 'katono/rogue.vim'

[[plugins]]
repo = 'lambdalisue/vim-findent'

[[plugins]]
repo = 'tweekmonster/helpful.vim'
on_cmd = 'HelpfulVersion'
extAttrs = { installerMinCommitDays = 0 }

[[plugins]]
repo = 'machakann/vim-vimhelplint'
on_ft = 'help'
[plugins.ftplugin]
help = '''
  nnoremap <buffer> ,r  <Cmd>VimhelpLint!<CR>
'''

[[plugins]]
repo = 'mattn/vim-goimports'
on_ft = 'go'
external_commands = ['goimports']
hook_source = '''
  let g:goimports_simplify = v:true
'''

[[plugins]]
repo = 'dag/vim2hs'
on_ft = 'haskell'
hook_source = '''
  let g:haskell_conceal = v:false
'''

[[plugins]]
repo = 'lambdalisue/vim-guise'
on_source = 'goda-term.vim'

[[plugins]]
repo = 'vim-jp/vimdoc-ja'
extAttrs = { installerMinCommitDays = 0 }
